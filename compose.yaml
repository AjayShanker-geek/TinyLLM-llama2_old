# Same command on macOS, Windows and Linux:
#   docker compose build
#   docker compose run --rm bench bash scripts/profile.sh
#
# Docker Desktop must be given more than these limits (Settings -> Resources,
# or %UserProfile%\.wslconfig on Windows), e.g. 8+ CPUs and 6 GB memory.
services:
  bench:
    build: .
    image: tinyllm-bench:1.0
    cpus: 8
    cpuset: "0-7"
    mem_limit: 4g
    memswap_limit: 4g # equal to mem_limit = no swap
    cap_add:
      - SYS_ADMIN # perf
    security_opt:
      - seccomp=unconfined # perf_event_open
    environment:
      OMP_NUM_THREADS: "8"
      OMP_PROC_BIND: close
      OMP_PLACES: cores
    volumes:
      - .:/workspace
    working_dir: /workspace
